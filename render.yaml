services:
  - type: web
    name: drowsiness-detector-api
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: drowsiness-detector-db
          property: connectionString
      - key: DROWSINESS_API_PREFIX
        value: /api/v1
      - key: DROWSINESS_CORS_ORIGINS
        value: https://drowsiness-detector-web.onrender.com
      - key: DROWSINESS_JWT_SECRET
        generateValue: true
      - key: DROWSINESS_LOG_LEVEL
        value: INFO

  - type: web
    name: drowsiness-detector-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://drowsiness-detector-api.onrender.com/api/v1
      - key: VITE_ALERT_POLL_MS
        value: "2200"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: drowsiness-detector-db
    databaseName: drowsiness_safety_phase1
    user: drowsiness_app
    plan: free
    region: singapore
