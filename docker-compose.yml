services:
  db:
    image: postgres:16
    container_name: drowsiness-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: drowsiness_safety_phase1
    ports:
      - "5432:5432"
    volumes:
      - ./database/drowsiness_safety_db_schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d drowsiness_safety_phase1"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
